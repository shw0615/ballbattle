<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Ball Battle</title>
<style>
/* ---------- 공용 / 메뉴 / 게임 화면 / 캐릭터 선택 화면 스타일 ---------- */
*{box-sizing:border-box}body{margin:0;background:#fff;color:#111;font-family:system-ui,sans-serif;height:100vh;overflow:hidden}
.s{display:none;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:10px;padding:12px;text-align:center}
button,input{font-size:17px;padding:11px 16px;border-radius:12px;border:2px solid #111}
button{background:#111;color:#fff;cursor:pointer;touch-action:manipulation}button:disabled{background:#ccc;border-color:#ccc;color:#777}
input{width:150px;text-align:center}
.b{display:flex;align-items:center;gap:10px;width:290px;background:#fff;color:#111;border-width:2px 2px 2px 12px;text-align:left}
.b img{width:48px;height:48px;border-radius:50%;border:3px solid}.b small{display:block;font-size:12px;opacity:.7}
#wrap{width:min(92vw,calc(100vh - 250px))}
canvas{width:100%;height:auto;display:block;border:5px solid #000;background:#fff}
#hud{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:10px}
.nm{font-size:24px;font-weight:800;margin-bottom:4px}.nm small{font-size:12px;font-weight:600;margin-left:6px;opacity:.8}.rh{width:290px;text-align:left;font-size:13px;font-weight:700;color:#666;margin:8px 0 2px;border-bottom:1px solid #ddd}#list{max-height:72vh;overflow:auto}.r{text-align:right}
.bar{position:relative;height:32px;border:3px solid #000;background:#ddd}
.bar i{position:absolute;inset:0 auto 0 0;background:#2fc24a;width:100%;transition:width .15s}.bar b{position:absolute;inset:0 auto 0 0;background:#e55;width:100%;transition:width .7s ease .25s}
.bar span{position:relative;color:#fff;font-weight:700;line-height:26px;text-shadow:0 0 3px #000}
.ul{height:4px}#sks{display:flex;gap:8px;width:min(92vw,400px)}#sks button{flex:1;padding:12px 4px;font-size:15px}
#pickS{overflow:auto;justify-content:flex-start}#list{width:min(94vw,440px);max-height:none;overflow:visible;text-align:left}
#chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.chip{padding:6px 12px;font-size:13px;border-radius:999px;background:#fff;color:#111;border:2px solid #ddd}.chip.on{background:#111;color:#fff;border-color:#111}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px;max-height:38vh;overflow:auto;padding:2px}
.cell{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;border:2px solid transparent;cursor:pointer}.cell.on{border-color:#111;background:#f4f4f4}
.cell img{width:54px;height:54px;border-radius:50%;border:3px solid}.cell span{font-size:13px;font-weight:700}.cell small{font-size:10px;color:#777}
#detail{margin:10px 0;padding:10px 12px;border-radius:12px;background:#f6f6f6;font-size:13px;line-height:1.45}.dh{font-size:17px;font-weight:800;margin-bottom:4px}.dh small{font-size:12px;font-weight:600;color:#666}.ds{margin-top:3px}#fl{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:99;background:radial-gradient(ellipse at center,rgba(255,0,0,.1) 25%,rgba(255,0,0,.8) 100%)}
</style></head><body>
<div id="menu" class="s" style="display:flex">
<h1>⚔️ Ball Battle</h1>
<button onclick="create()">방 만들기</button>
<div><input id="code" placeholder="방 코드" inputmode="numeric" maxlength="4"> <button onclick="join()">참가</button></div>
<button onclick="solo1()" style="background:#fff;color:#111">혼자 연습 (AI)</button>
<p id="msg"></p></div>
<div id="pickS" class="s"><h2>공을 고르세요</h2><div id="list"></div><p id="pmsg"></p></div>
<div id="game" class="s" style="gap:8px;padding:6px">
<div id="wrap"><canvas id="cv"></canvas>
<div id="hud">
<div><div class="nm"><span id="n0"></span><small id="r0"></small></div><div class="bar"><b id="g0"></b><i id="f0"></i><span id="t0"></span></div><div class="ul" id="u0"></div></div>
<div class="r"><div class="nm"><span id="n1"></span><small id="r1"></small></div><div class="bar"><b id="g1"></b><i id="f1"></i><span id="t1"></span></div><div class="ul" id="u1"></div></div>
</div></div>
<div id="sks"><button id="sk1" onclick="useSkill(1)"></button><button id="sk2" onclick="useSkill(2)"></button></div>
<button id="again" onclick="location.reload()" style="display:none;position:absolute;top:50%">메뉴로</button></div>
<div id="fl"></div>
<script async src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
'use strict';
/* =====================================================================
   BALL BATTLE
   ---------------------------------------------------------------------
   [파일 구성 - 위에서 아래로]
    1. 설정 / 상수
    2. 캐릭터 등록 시스템 (엔진 API 설명)
    3. 소리
    4. 네트워크 / 메뉴
    5. 캐릭터 선택 화면
    6. 게임 로직 - 공용 도우미
    7. 게임 로직 - 매 프레임 계산 (step)
    8. 렌더링 - 공용
    9. HUD + 메인 루프
   10. ★ 캐릭터 모음 (캐릭터 1명 = 블록 1개)  ← 새 캐릭터는 맨 아래에 추가!
   ===================================================================== */


/* ---------------------------------------------------------------------
   1. 설정 / 상수
   --------------------------------------------------------------------- */
const W=400,H=400,R=22,TILE=40,EVDOT=1,BR=Math.hypot(W-2*R,H-2*R)*.85,$=id=>document.getElementById(id);
const LF=.33,ERR=.31; // 조준 보정: LF=적 이동 예측 비율(높을수록 정확) / ERR=조준 오차(낮을수록 정확)
const ROLES=['탱커','어쌔신','서포터','컨트롤러','데미지딜러','저격수','투척수'];
const CDK=['c1','c2','fr','mk','bn','st','fzn','inv','slw','kb','sl']; // 매 틱 줄어드는 타이머 목록
let S=null,role='host',conn=null,peer=null,solo=false,myIdx=0,pick=[null,null],started=false,rt=0,last=performance.now(),acc=0,fc=0;


/* ---------------------------------------------------------------------
   2. 캐릭터 등록 시스템
   ---------------------------------------------------------------------
   캐릭터는 맨 아래 "캐릭터 모음"에서 addChar({...}) 로 등록합니다. 등록 순서가 곧 캐릭터 번호(t)입니다.

   addChar 에 쓸 수 있는 항목 (필요한 것만 쓰면 됨)
   [정보]  n 이름 / r 역할 / c 색상 / d 한줄설명 / s 스킬설명[] / hp 체력 / spd 기본속도(기본 150) / img 얼굴 그림(data URL)
   [스킬]  sk 버튼이름[2개] / skill(i,n,b,e) 스킬 사용  (i=내 번호, n=1|2, b=나, e=상대)
   [틱]    init(b) 고유 변수 초기화 / speed(b,dt) 속도 계산 / spdMul(b,sp) 감속 후 속도 보정
           tick(b,i,dt,e,bw) 매 틱 고유 로직 / touch(b) 몸통박치기 추가 피해 / busy(b) 못 움직이는 상태
           world(dt) 맵 전체 로직 / onFreeze(b,e) 상대를 얼렸을 때 / aiSkip(b,n) AI가 이 스킬을 건너뛸지
   [표시]  hud(me,k,c) 스킬 버튼 글자 → [글자|null, 비활성(1/0)] 또는 null
           drawBg(V) 바닥 그리기 / under(V,t) 공 아래 그리기 / drawPre(b,x,y,i) 공 그리기 직전 / lift(b) 점프 높이(0~1)
           drawPost(b,x,y,dup) 공 위에 덧그리기 / fxg() 전역 효과음 / snd[[..],[..]] 스킬 효과음 / shk[] 화면 흔들림 / hrKb 홈런 넉백
   UK[종류]  = 투사체/이펙트:  upd(u,dt,e,j) 매틱 갱신(false 반환 시 삭제) / draw(u,A) 그리기 / ground 바닥 레이어
                              grow 반지름 증가 속도 / miss(u) 빗나감 / hit(u,e,j) 명중 / affect(u,p,dt) 장판이 날아가는 투사체에 주는 영향
   EK[종류]  = 소환물:         upd(en,dt,e,ob,nw) / draw(en)
   GRN[번호] = 투척물(gren):   sp 속도 / s 크기 / direct 직접 명중 판정 / draw(u) / land(u,j,dh) 착지
   --------------------------------------------------------------------- */
const CH=[],IM=[],UK={},EK={},GRN={};
const mkImg=s=>{const i=new Image();i.src=s;return i};
function addChar(d){d.t=CH.length;IM[d.t]=mkImg(d.img);CH.push(d);return d}
const timer=(u,dt)=>{u.l-=dt;return u.l>0}; // 수명이 다하면 사라지는 단순 이펙트용


/* ---------------------------------------------------------------------
   3. 소리
   --------------------------------------------------------------------- */
let AC;function au(){try{AC=AC||new(window.AudioContext||webkitAudioContext)();AC.resume()}catch(e){}}
addEventListener('pointerdown',au);
function tone(f,d,ty,v,f2){if(!AC)return;const o=AC.createOscillator(),q=AC.createGain(),t=AC.currentTime;o.type=ty||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);q.gain.setValueAtTime(v||.15,t);q.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(q).connect(AC.destination);o.start(t);o.stop(t+d)}
let NB;function noise(d,v,fq){if(!AC)return;if(!NB){const n=AC.sampleRate,a=(NB=AC.createBuffer(1,n,n)).getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1}
 const s=AC.createBufferSource(),f=AC.createBiquadFilter(),q=AC.createGain(),t=AC.currentTime;f.type='lowpass';f.frequency.value=fq;q.gain.setValueAtTime(v,t);q.gain.exponentialRampToValueAtTime(.001,t+d);s.buffer=NB;s.connect(f).connect(q).connect(AC.destination);s.start(t);s.stop(t+d)}


/* ---------------------------------------------------------------------
   4. 네트워크 / 메뉴
   --------------------------------------------------------------------- */
function show(id){['menu','pickS','game'].forEach(x=>$(x).style.display=x==id?'flex':'none')}
function msg(t){$('msg').textContent=t}
function create(){if(typeof Peer=='undefined')return msg('연결 모듈 로딩 중... 잠시 후 다시 눌러주세요');
 const code=1000+Math.floor(Math.random()*9000);msg('연결 준비 중...');
 peer=new Peer('bbs-'+code);
 peer.on('open',()=>msg('방 코드: '+code+' — 친구 접속 대기 중'));
 peer.on('error',e=>msg('오류: '+e.type+' (다시 시도해 주세요)'));
 peer.on('connection',c=>{conn=c;role='host';myIdx=0;setup(c);show('pickS');initPick()})}
function join(){if(typeof Peer=='undefined')return msg('연결 모듈 로딩 중... 잠시 후 다시 눌러주세요');
 const code=$('code').value.trim();if(code.length!=4)return msg('4자리 코드를 입력하세요');
 msg('접속 중...');peer=new Peer();
 peer.on('error',e=>msg('오류: '+e.type+' (코드 확인)'));
 peer.on('open',()=>{const c=peer.connect('bbs-'+code,{serialization:'json'});
  c.on('open',()=>{conn=c;role='guest';myIdx=1;setup(c);show('pickS');initPick()})})}
function solo1(){solo=true;role='host';pick[1]=Math.floor(Math.random()*CH.length);show('pickS');initPick()}
function setup(c){c.on('data',d=>{
 if(d.t=='pick'&&role=='host'){pick[1]=d.b;tryStart()}
 else if(d.t=='k'&&role=='host')skill(1,d.n);
 else if(d.t=='s'){S=JSON.parse(d.j);rt=performance.now();if(!started){started=true;show('game')}}});
 c.on('close',()=>{if(!S||S.w<0)alert('연결이 끊겼어요');});}


/* ---------------------------------------------------------------------
   5. 캐릭터 선택 화면
   --------------------------------------------------------------------- */
let selK=-1,flt='전체';
function initPick(){const L=$('list');L.style.display='block';selK=-1;flt='전체';
 L.innerHTML='<div id="chips"></div><div id="grid"></div><div id="detail">공을 눌러 정보를 확인하세요</div><button id="go" disabled style="width:100%">선택</button>';
 ['전체'].concat(ROLES.filter(r=>CH.some(x=>x.r==r))).forEach(r=>{const b=document.createElement('button');b.className='chip';b.textContent=r;b.dataset.r=r;b.onclick=()=>{flt=r;renderGrid()};$('chips').appendChild(b)});
 $('go').onclick=()=>{if(selK>=0)choose(selK)};renderGrid()}
function renderGrid(){const G=$('grid');G.innerHTML='';Array.from($('chips').children).forEach(c=>c.classList.toggle('on',c.dataset.r==flt));
 CH.forEach((x,k)=>{if(flt!='전체'&&x.r!=flt)return;const c=document.createElement('div');c.className='cell'+(k==selK?' on':'');
  c.innerHTML='<img style="border-color:'+x.c+'" src="'+x.img+'"><span>'+x.n+'</span><small>'+x.r+'</small>';c.onclick=()=>selPick(k);G.appendChild(c)})}
function selPick(k){selK=k;const x=CH[k];$('detail').innerHTML='<div class="dh" style="color:'+x.c+'">'+x.n+' <small>'+x.r+' · HP '+x.hp+'</small></div>'+x.s.map(s=>'<div class="ds">'+s+'</div>').join('');$('go').disabled=false;$('go').textContent=x.n+' 선택';renderGrid()}
function choose(i){$('list').style.display='none';$('pmsg').textContent='선택 완료! 상대 대기 중...';
 if(role=='host'){pick[0]=i;tryStart()}else conn.send({t:'pick',b:i})}


/* ---------------------------------------------------------------------
   6. 게임 로직 - 공용 도우미 (호스트만 실행)
   --------------------------------------------------------------------- */
// 공 한 개의 기본 상태. 캐릭터 고유 변수는 각 캐릭터의 init(b) 에서 추가한다.
const mk=(t,i)=>{const c=CH[t],b={t,x:W*(i?.75:.25),y:H/2,vx:i?-100:100,vy:i?90:-90,hp:c.hp,mx:c.hp,
 c1:0,c2:0,                                       // 스킬1·2 쿨타임
 fr:0,mk:0,bn:0,bd:0,st:0,fzn:0,slw:0,sf:.6,inv:0, // 공포·표식·화상·기절·동결·감속·무적
 kb:0,kx:0,ky:0,sl:0,ph:0,hid:0,sq:0,dots:[],fr2:0,frt:0}; // 넉백·미끄러짐·숨음·연발·도트·프로스트
 if(c.init)c.init(b);return b};
function tryStart(){if(pick[0]==null||pick[1]==null)return;
 S={w:-1,ct:3,gt:0,t2:0,u:[],f:[],e:[],q:null,qn:5,qc:0,b:pick.map(mk)};show('game');started=true;
 last=performance.now()}

const cl=(v,m)=>Math.min(W-m,Math.max(m,v));
// 피해. 표식(mk) 상태면 bn만큼 추가 피해
function hit(j,d,bn=2){const b=S.b[j];if(b.inv>0)return;let yl=0;if(b.mk>0){d+=bn;yl=1}b.hp-=d;S.f.push({x:b.x,y:b.y-R,v:d,yl,l:.8})}
// 충돌 원 목록 (숨은 공은 없음 / RT 분리 상태면 2개)
const cs=b=>b.hid?[]:b.sp?[[b.x,b.y,1],[b.lx,b.ly,0]]:[[b.x,b.y,1]];
function sg(x0,y0,x1,y1,cx,cy){const dx=x1-x0,dy=y1-y0,l=dx*dx+dy*dy;let q=l?((cx-x0)*dx+(cy-y0)*dy)/l:0;q=q<0?0:q>1?1:q;return Math.hypot(x0+dx*q-cx,y0+dy*q-cy)}
// 점/선분이 공 e 에 닿았는지 (cs() 와 같은 판정이지만 배열을 만들지 않아 더 빠름)
const ptHit=(e,x,y,r)=>!e.hid&&(Math.hypot(e.x-x,e.y-y)<r||(e.sp&&Math.hypot(e.lx-x,e.ly-y)<r));
const segHit=(e,x0,y0,x1,y1,r)=>!e.hid&&(sg(x0,y0,x1,y1,e.x,e.y)<r||(e.sp&&sg(x0,y0,x1,y1,e.lx,e.ly)<r));
// 조준: 적의 이동을 LF 만큼 예측하고 er 만큼 오차를 줌
function aim(b,e,sp,er){const dx=e.x-b.x,dy=e.y-b.y,vx=e.vx,vy=e.vy,A=vx*vx+vy*vy-sp*sp,B=2*(dx*vx+dy*vy),C=dx*dx+dy*dy;let q=Infinity;
 if(Math.abs(A)<1e-6){if(B)q=-C/B}else{const D=B*B-4*A*C;if(D>=0){const s=Math.sqrt(D);[(-B-s)/(2*A),(-B+s)/(2*A)].forEach(v=>{if(v>0&&v<q)q=v})}}
 if(!isFinite(q)||q>1.2||q<=0)q=Math.hypot(dx,dy)/sp;
 const px=Math.min(W-R,Math.max(R,e.x+vx*q*LF)),py=Math.min(H-R,Math.max(R,e.y+vy*q*LF));return Math.atan2(py-b.y,px-b.x)+(er?(Math.random()-.5)*2*ERR*er:0)}
// 투사체 발사
function pj(i,a,sp,o){const b=S.b[i];S.u.push({x:b.x,y:b.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,o:i,...o})}
// 조준 대상: 상대 공 또는 더 가까운 상대 소환물
function tgt(b,i){const e=S.b[1-i];let best=e,bd=Math.hypot(e.x-b.x,e.y-b.y);
 for(const en of S.e){if(en.o==i)continue;const d=Math.hypot(en.x-b.x,en.y-b.y);if(d<bd){bd=d;best={x:en.x,y:en.y,vx:en.vx||0,vy:en.vy||0,u:1}}}return best}
// 프로스트(얼음 게이지) 누적. 가득 차면 2초 동결. o = 얼린 쪽 공
function frost(e,v,o){if(e.st>0)return;e.fr2=Math.min(100,(e.fr2||0)+v);e.frt=2;if(e.fr2>=100){e.fr2=0;e.st=2;e.fzn=2;const c=CH[o.t];if(c.onFreeze)c.onFreeze(o,e)}}
// 넉백
function knock(e,vx,vy,sp=240,t=.25){const m=Math.hypot(vx,vy)||1;e.kb=t;e.kx=vx/m*sp;e.ky=vy/m*sp}
// 투척물 (스파이크 선인장 / 루 시럽 캔 공용). 종류별 설정은 GRN[번호] 에 등록
function gren(i,tg,f){const b=S.b[i],G=GRN[f],sp=G.sp,a=aim(b,tg,sp,.4),d=Math.min(6*TILE,Math.hypot(tg.x-b.x,tg.y-b.y));pj(i,a,sp,{k:'gr',f,td:d,s:G.s,rg:9999,a})}
UK.gr={
 upd(u,dt,e,j){const sp=Math.hypot(u.vx,u.vy),G=GRN[u.f];u.x+=u.vx*dt;u.y+=u.vy*dt;u.td-=sp*dt;let bm=u.td<=0,dh=0;
  if(!bm&&G.direct){dh=ptHit(e,u.x,u.y,R+u.s);bm=dh||S.e.some(en=>en.o!=u.o&&Math.hypot(en.x-u.x,en.y-u.y)<en.r+u.s)}
  if(!bm)return true;
  G.land(u,j,dh);return false},
 draw(u){g.translate(u.x,u.y);g.rotate(NOW/150);GRN[u.f].draw(u)}};
// 스킬 사용 (캐릭터별 로직은 각 캐릭터의 skill 훅에 있음)
function skill(i,n){if(!S||S.ct>0||S.w>=0)return;const b=S.b[i],c=CH[b.t];if(!c.skill||b.st>0)return;c.skill(i,n,b,S.b[1-i])}

UK.wv={ground:1,grow:200, // 검은 파도
 upd(u,dt,e,j){u.r+=200*dt;if(!u.h){const d=Math.hypot(e.x-u.x,e.y-u.y);let da=Math.atan2(e.y-u.y,e.x-u.x)-u.a;da=Math.atan2(Math.sin(da),Math.cos(da));if(Math.abs(d-u.r)<R+8&&Math.abs(da)<.65+Math.asin(Math.min(1,R/Math.max(d,R)))){u.h=1;hit(j,30);e.fr=2}}return u.r<107},
 draw:(u,A)=>{const al=Math.max(.3,.95-u.r/250);g.lineCap='round';
  g.strokeStyle='rgba(130,70,210,'+al*.35+')';g.lineWidth=24;g.beginPath();g.arc(u.x,u.y,u.r,u.a-.68,u.a+.68);g.stroke();

  g.strokeStyle='rgba(190,130,255,'+al*.7+')';g.lineWidth=3;g.beginPath();g.arc(u.x,u.y,u.r+5,u.a-.6,u.a+.6);g.stroke();

/* =====================================================================
   ★ 볼트 ─ 탱커
   패시브 가속(속도만큼 충돌 피해↑) / 불꽃 질주(불꽃길)
   ===================================================================== */
const BOLT_TR=[[],[]]; // 가속 잔상 기록
addChar({
 n:'볼트',r:'탱커',c:'#e0a800',d:'가속 질주 · 불꽃길',hp:250,
 s:['패시브: 굴러갈수록 가속, 속도만큼 충돌 피해 증가 (벽에 튕기면 초기화)',
    '① 불꽃 질주 (쿨 10초): 5초간 속도 +25%, 불꽃길을 남김 (닿으면 3초간 5 피해). 벽에 튕기면 종료'],
 sk:['불꽃 질주','—'],
 snd:[[200,.5,'sawtooth',.12,800,.3,2500]],
 init(b){b.ac=0;b.vt=0;b.fx=0;b.fy=0},          // ac: 가속도 / vt: 질주 남은 시간 / fx,fy: 마지막 불꽃 위치
 speed(b,dt){b.ac=Math.min(250,b.ac+100*dt);let sp=170+b.ac;if(b.vt>0)sp*=1.25;return sp},
 touch(b){return Math.round(b.ac/25)},          // 속도에 비례한 충돌 추가 피해
 skill(i,n,b,e){if(n!=1||b.c1>0||b.vt>0)return;b.vt=5;b.fx=b.x;b.fy=b.y},
 tick(b,i,dt,e,bw){if(bw)b.ac=0;if(b.vt>0){b.vt-=dt;if(Math.hypot(b.x-b.fx,b.y-b.fy)>=14){b.fx=b.x;b.fy=b.y;S.u.push({k:'fi',x:b.x,y:b.y,o:i,l:99})}if(bw||b.vt<=0){b.vt=0;b.c1=10;S.u.forEach(u=>{if(u.k=='fi'&&u.o==i)u.l=Math.min(u.l,.6)})}}},
 hud(me,k){return k==1&&me.vt>0?['질주중',1]:null},
 drawPre(b,x,y,i){const f=Math.min(1,b.ac/250),tr=BOLT_TR[i];tr.push([b.x,b.y]);if(tr.length>12)tr.shift();
  if(f>.12){tr.forEach((p,k)=>{g.globalAlpha=f*.4*k/tr.length;g.fillStyle='#ffb800';g.beginPath();g.arc(p[0],p[1],R*(.55+.45*k/tr.length),0,7);g.fill()});g.globalAlpha=1;

  if(en.uc<=0&&ptHit(e,en.x,en.y,R+en.r)){en.hp-=5;en.uc=.5}return true},

  g.fillStyle='#6bbf59';[[-8,-6,5],[6,2,6],[-3,12,4]].forEach(p=>{g.beginPath();g.arc(p[0],p[1],p[2],0,7);g.fill()});
  g.strokeStyle='rgba(40,160,40,.6)';g.lineWidth=3;g.beginPath();g.arc(0,0,en.r+7,-1.57,-1.57+6.28*Math.max(0,en.t)/5);g.stroke();g.restore();hb(x,y+en.r+8,34,en.hp/en.mx,'#3b3')}};

  en.hp-=15*dt;if(en.hp<=0)return false;if(ptHit(e,en.x,en.y,R+en.r)){e.dots.push(4);return false}return true},
 draw(en,x,y){g.fillStyle='#7ddc4a';g.strokeStyle='#2a7a1a';g.lineWidth=2;g.beginPath();g.arc(x,y,en.r,0,7);g.fill();g.stroke();g.fillStyle='#fff';g.beginPath();g.arc(x-3,y-2,2.6,0,7);g.arc(x+3,y-2,2.6,0,7);g.fill();g.fillStyle='#000';g.beginPath();g.arc(x-3,y-2,1.2,0,7);g.arc(x+3,y-2,1.2,0,7);g.fill();hb(x,y+en.r+3,16,en.hp/en.mx,'#3b3')}};

  en.x=cl(en.x+en.vx*dt,R);en.y=cl(en.y+en.vy*dt,R);en.hp-=2*dt; // 곰은 가만히 있어도 초당 2씩 체력이 깎임
  if(en.hp<=0){ob.c2=20;return false}
  if(ptHit(e,en.x,en.y,R+en.r)){if(en.cd<=0){hit(1-en.o,8);en.cd=1}if(en.uc<=0){en.hp-=5;en.uc=.5}}return true},

function cac(r,n,ang,face){g.save();g.rotate(ang);g.strokeStyle='#e8f5c8';g.lineWidth=Math.max(1.5,r*.12);g.lineCap='round';
 for(let k=0;k<n;k++){const t=k*6.2832/n;g.beginPath();g.moveTo(Math.cos(t)*r*.85,Math.sin(t)*r*.85);g.lineTo(Math.cos(t)*r*1.45,Math.sin(t)*r*1.45);g.stroke()}
 g.fillStyle=face?'#1f6b2c':'#3fae4a';g.strokeStyle='#14501f';g.lineWidth=Math.max(2,r*.12);g.beginPath();g.arc(0,0,r,0,7);g.fill();g.stroke();
 g.strokeStyle='rgba(10,60,20,.55)';g.lineWidth=Math.max(1.5,r*.08);for(const w of[.35,.7]){g.beginPath();g.ellipse(0,0,r*w,r,0,0,7);g.stroke()}
 g.fillStyle='#fff7c0';for(let k=0;k<8;k++){const t=k*.785+.3,q=r*(.4+.3*(k%2));g.beginPath();g.arc(Math.cos(t)*q,Math.sin(t)*q,r*.07,0,7);g.fill()}
 if(!face){g.fillStyle='#ff6fa8';g.strokeStyle='#c43a77';g.lineWidth=1.5;g.beginPath();g.arc(0,-r*.95,r*.32,0,7);g.fill();g.stroke();g.fillStyle='#ffe14a';g.beginPath();g.arc(0,-r*.95,r*.12,0,7);g.fill()}
 g.restore();
 if(face){g.fillStyle='#ffe14a';g.strokeStyle='#ff3b30';g.lineWidth=1.5;for(const m of[-1,1]){g.beginPath();g.moveTo(m*r*.65,-r*.35);g.lineTo(m*r*.1,-r*.05);g.lineTo(m*r*.55,r*.12);g.closePath();g.fill();g.stroke()}
  g.strokeStyle='#ffd0c0';g.lineWidth=2;g.beginPath();g.moveTo(-r*.4,r*.45);for(let k=0;k<5;k++)g.lineTo(-r*.4+k*r*.2+r*.1,r*(k%2?.45:.62));g.stroke()}}
