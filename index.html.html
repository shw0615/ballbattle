<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Ball Battle</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#111;font-family:system-ui,sans-serif;height:100vh;overflow:hidden}
.s{display:none;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:10px;padding:12px;text-align:center}
button,input{font-size:17px;padding:11px 16px;border-radius:12px;border:2px solid #111}
button{background:#111;color:#fff;cursor:pointer}button:disabled{background:#ccc;border-color:#ccc;color:#777}
input{width:150px;text-align:center}
.b{display:flex;align-items:center;gap:10px;width:290px;background:#fff;color:#111;border-width:2px 2px 2px 12px;text-align:left}
.b img{width:48px;height:48px;border-radius:50%;border:3px solid}.b small{display:block;font-size:12px;opacity:.7}
#wrap{width:min(92vw,calc(100vh - 250px))}
canvas{width:100%;height:auto;display:block;border:5px solid #000;background:#fff}
#hud{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:10px}
.nm{font-size:24px;font-weight:800;margin-bottom:4px}.r{text-align:right}
.bar{position:relative;height:32px;border:3px solid #000;background:#ddd}
.bar i{position:absolute;inset:0 auto 0 0;background:#2fc24a;width:100%}
.bar span{position:relative;color:#fff;font-weight:700;line-height:26px;text-shadow:0 0 3px #000}
.ul{height:4px}#sks{display:flex;gap:8px;width:min(92vw,400px)}#sks button{flex:1;padding:12px 4px;font-size:15px}
</style></head><body>
<div id="menu" class="s" style="display:flex">
<h1>⚔️ Ball Battle</h1>
<button onclick="create()">방 만들기</button>
<div><input id="code" placeholder="방 코드" inputmode="numeric" maxlength="4"> <button onclick="join()">참가</button></div>
<button onclick="solo1()" style="background:#fff;color:#111">혼자 연습 (AI)</button>
<p id="msg"></p></div>
<div id="pickS" class="s"><h2>공을 고르세요</h2><div id="list"></div><p id="pmsg"></p></div>
<div id="game" class="s" style="gap:8px;padding:6px">
<div id="wrap"><canvas id="cv"></canvas>
<div id="hud">
<div><div class="nm" id="n0"></div><div class="bar"><i id="f0"></i><span id="t0"></span></div><div class="ul" id="u0"></div></div>
<div class="r"><div class="nm" id="n1"></div><div class="bar"><i id="f1"></i><span id="t1"></span></div><div class="ul" id="u1"></div></div>
</div></div>
<div id="sks"><button id="sk1" onclick="useSkill(1)"></button><button id="sk2" onclick="useSkill(2)"></button></div>
<button id="again" onclick="location.reload()" style="display:none;position:absolute;top:50%">메뉴로</button></div>
